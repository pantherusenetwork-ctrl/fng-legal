# Compile RackForgePrime en exécutable Windows (.exe) avec PyInstaller.
# Déclenché à chaque push touchant rackforgeprime/, ou à la main
# (onglet Actions → « Build RackForgePrime Windows exe » → Run workflow).
# L'exe est publié comme artefact du run : Actions → le run → Artifacts.
name: Build RackForgePrime Windows exe

on:
  workflow_dispatch:
  push:
    paths:
      - "rackforgeprime/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r rackforgeprime/requirements.txt pyinstaller

      - name: Tests (le moteur de placement doit être vert avant de packager)
        run: python -m pytest rackforgeprime/tests/ -q

      - name: Compiler l'exe (PyInstaller onefile)
        run: >
          pyinstaller --noconfirm --onefile --clean
          --name RackForgePrime
          --paths rackforgeprime/backend
          --add-data "rackforgeprime/frontend;frontend"
          --collect-all uvicorn
          rackforgeprime/run.py

      - name: Vérifier que l'exe démarre et répond
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/RackForgePrime.exe" `
                 -ArgumentList "--no-browser","--port","8137" -PassThru
          Start-Sleep -Seconds 12
          $ok = $false
          try {
            $r = Invoke-WebRequest -Uri "http://127.0.0.1:8137/api/catalog" -UseBasicParsing
            $ok = ($r.StatusCode -eq 200 -and $r.Content -match "fortigate")
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
          if (-not $ok) { throw "L'exe n'a pas répondu correctement sur /api/catalog" }

      - name: Publier l'exe en artefact
        uses: actions/upload-artifact@v4
        with:
          name: RackForgePrime-Windows
          path: dist/RackForgePrime.exe
          retention-days: 30
