<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- RackForgePrime — icône E « monogramme R + éclair » (choix planche du 31/08). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232b3d"/>
      <stop offset=".55" stop-color="#141a28"/>
      <stop offset="1" stop-color="#0a0d15"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset=".45" stop-color="#ffa726"/>
      <stop offset="1" stop-color="#f4590d"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#tile)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none"
        stroke="#3d4a63" stroke-opacity=".55" stroke-width="4"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none"
        stroke="#000000" stroke-opacity=".35" stroke-width="6"/>

  <!-- Discrètes lignes de rack en fond (ADN baie) -->
  <g stroke="#2a3448" stroke-width="5">
    <line x1="84" y1="150" x2="428" y2="150"/>
    <line x1="84" y1="256" x2="428" y2="256"/>
    <line x1="84" y1="362" x2="428" y2="362"/>
  </g>

  <!-- R massif -->
  <text x="118" y="356" font-family="Arial Black, Arial, sans-serif"
        font-size="268" font-weight="900" fill="#e2e8f0">R</text>

  <!-- Éclair incandescent -->
  <path filter="url(#glow)" fill="url(#bolt)"
        d="M 392 106 L 300 240 L 352 248 L 310 402 L 412 236 L 356 228 Z"/>
</svg>
