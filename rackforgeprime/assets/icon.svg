<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Icône RackForgePrime — hache de forge orageuse (inspiration libre,
       dessin original) : lame large + éclair cyan de la DA. -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#0b0e14"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="none"
        stroke="#1b2230" stroke-width="6"/>

  <!-- Éclair cyan derrière la hache -->
  <polygon points="176,26 118,116 152,116 96,208 178,104 142,104 198,26"
           fill="#22d3ee"/>
  <polygon points="170,38 124,110 156,110 112,186 168,110 136,110 184,38"
           fill="#7ce8f8" opacity="0.55"/>

  <!-- Manche diagonal (bois sombre, frettes claires) -->
  <g transform="rotate(38 128 128)">
    <rect x="119" y="70" width="18" height="150" rx="8" fill="#3d2f22"/>
    <rect x="119" y="176" width="18" height="8" fill="#6b5137"/>
    <rect x="119" y="192" width="18" height="8" fill="#6b5137"/>
    <rect x="119" y="94" width="18" height="6" fill="#252a35"/>

    <!-- Tête : lame large à gauche + masse plate à droite -->
    <!-- Masse (côté marteau) -->
    <rect x="137" y="52" width="34" height="40" rx="6" fill="#8d99a8"/>
    <rect x="163" y="52" width="8" height="40" rx="3" fill="#aab6c4"/>
    <!-- Corps de lame -->
    <path d="M119 46 L62 30 Q40 72 62 114 L119 98 Z" fill="#cdd6e0"/>
    <!-- Tranchant éclairci -->
    <path d="M62 30 Q40 72 62 114 L74 110 Q56 72 74 34 Z" fill="#eef3f8"/>
    <!-- Gorge sombre côté manche -->
    <rect x="107" y="46" width="12" height="52" fill="#5a6474"/>
    <!-- Rivets -->
    <circle cx="128" cy="60" r="4" fill="#252a35"/>
    <circle cx="128" cy="84" r="4" fill="#252a35"/>
  </g>
</svg>
