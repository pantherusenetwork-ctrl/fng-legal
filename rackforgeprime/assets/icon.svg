<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- RackForgePrime — icône « slot forgé » v2.
       Baie sombre en profondeur, rails métalliques vissés, trois tiroirs
       serveurs avec LEDs, et LE slot : un éclair incandescent qui irradie. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232b3d"/>
      <stop offset=".55" stop-color="#141a28"/>
      <stop offset="1" stop-color="#0a0d15"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d4a63"/>
      <stop offset=".5" stop-color="#2a3448"/>
      <stop offset="1" stop-color="#1c2434"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3547"/>
      <stop offset=".18" stop-color="#222a3a"/>
      <stop offset="1" stop-color="#181f2d"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset=".45" stop-color="#ffa726"/>
      <stop offset="1" stop-color="#f4590d"/>
    </linearGradient>
    <linearGradient id="forge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2410"/>
      <stop offset=".5" stop-color="#241507"/>
      <stop offset="1" stop-color="#170d03"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Tuile -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#tile)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none"
        stroke="#3d4a63" stroke-opacity=".55" stroke-width="4"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none"
        stroke="#000000" stroke-opacity=".35" stroke-width="6"/>

  <!-- Rails métalliques vissés -->
  <rect x="88" y="84" width="30" height="344" rx="8" fill="url(#steel)"/>
  <rect x="394" y="84" width="30" height="344" rx="8" fill="url(#steel)"/>
  <g fill="#0b0f18">
    <circle cx="103" cy="116" r="7"/><circle cx="103" cy="192" r="7"/>
    <circle cx="103" cy="268" r="7"/><circle cx="103" cy="344" r="7"/>
    <circle cx="103" cy="404" r="7"/>
    <circle cx="409" cy="116" r="7"/><circle cx="409" cy="192" r="7"/>
    <circle cx="409" cy="268" r="7"/><circle cx="409" cy="344" r="7"/>
    <circle cx="409" cy="404" r="7"/>
  </g>

  <!-- Tiroir 1 -->
  <g>
    <rect x="126" y="96" width="260" height="62" rx="10" fill="url(#face)"/>
    <rect x="126" y="96" width="260" height="62" rx="10" fill="none"
          stroke="#0a0e16" stroke-width="3"/>
    <rect x="140" y="110" width="120" height="8" rx="4" fill="#3a465c"/>
    <rect x="140" y="128" width="86" height="8" rx="4" fill="#2c3547"/>
    <circle cx="356" cy="114" r="6" fill="#38e07a"/>
    <circle cx="356" cy="138" r="6" fill="#2c3547"/>
  </g>
  <!-- Tiroir 2 -->
  <g>
    <rect x="126" y="170" width="260" height="62" rx="10" fill="url(#face)"/>
    <rect x="126" y="170" width="260" height="62" rx="10" fill="none"
          stroke="#0a0e16" stroke-width="3"/>
    <rect x="140" y="184" width="120" height="8" rx="4" fill="#3a465c"/>
    <rect x="140" y="202" width="86" height="8" rx="4" fill="#2c3547"/>
    <circle cx="356" cy="188" r="6" fill="#38e07a"/>
    <circle cx="356" cy="212" r="6" fill="#ffa726"/>
  </g>

  <!-- LE slot forgé : creuset sombre, éclair incandescent -->
  <g>
    <rect x="126" y="244" width="260" height="98" rx="12" fill="url(#forge)"/>
    <rect x="126" y="244" width="260" height="98" rx="12" fill="none"
          stroke="#f4590d" stroke-opacity=".65" stroke-width="3"/>
    <path filter="url(#glow)" fill="url(#bolt)"
          d="M 292 236 L 218 300 L 258 306 L 224 352 L 302 288 L 260 282 Z"/>
  </g>

  <!-- Tiroir 4 -->
  <g>
    <rect x="126" y="354" width="260" height="62" rx="10" fill="url(#face)"/>
    <rect x="126" y="354" width="260" height="62" rx="10" fill="none"
          stroke="#0a0e16" stroke-width="3"/>
    <rect x="140" y="368" width="120" height="8" rx="4" fill="#3a465c"/>
    <rect x="140" y="386" width="86" height="8" rx="4" fill="#2c3547"/>
    <circle cx="356" cy="372" r="6" fill="#38e07a"/>
    <circle cx="356" cy="396" r="6" fill="#38e07a"/>
  </g>

  <!-- Socle accent -->
  <rect x="150" y="438" width="212" height="10" rx="5" fill="url(#bolt)" opacity=".9"/>
</svg>
