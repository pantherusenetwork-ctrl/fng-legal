<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- RackForgePrime — icône G « enclume de forge » (test du 31/08 ;
       la E « monogramme R+éclair » reste en réserve dans le git). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232b3d"/>
      <stop offset=".55" stop-color="#141a28"/>
      <stop offset="1" stop-color="#0a0d15"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset=".45" stop-color="#ffa726"/>
      <stop offset="1" stop-color="#f4590d"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5a78"/>
      <stop offset=".5" stop-color="#33405a"/>
      <stop offset="1" stop-color="#222b3e"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#tile)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none"
        stroke="#3d4a63" stroke-opacity=".55" stroke-width="4"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none"
        stroke="#000000" stroke-opacity=".35" stroke-width="6"/>

  <!-- Éclair incandescent qui frappe l'enclume -->
  <path filter="url(#glow)" fill="url(#bolt)"
        d="M 302 52 L 208 170 L 258 178 L 224 246 L 314 136 L 262 128 Z"/>

  <!-- Enclume métallique -->
  <g>
    <path fill="url(#steel)"
          d="M 118 258 h 276 v 34 a 78 78 0 0 1 -72 46 h -50 v 44 h 46 v 32 h -156 v -32 h 46 v -44 h -20 a 90 90 0 0 1 -70 -80 z"/>
    <path fill="#0b0f18" opacity=".35"
          d="M 118 258 h 276 v 12 h -276 z"/>
    <!-- reflet chaud de la frappe sur la table -->
    <rect x="196" y="252" width="120" height="8" rx="4"
          fill="url(#bolt)" opacity=".85"/>
  </g>

  <!-- Socle -->
  <rect x="150" y="428" width="212" height="14" rx="7" fill="#222b3e"/>
</svg>
